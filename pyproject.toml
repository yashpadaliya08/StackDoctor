[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "laravel-doctor"
version = "1.0.0"
description = "Automated Diagnostic & Fix Engine for Laravel Projects"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "cryptography>=42.0.0",
    "GitPython>=3.1.40",
    "httpx>=0.27.0",
    "paramiko>=3.4.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
laravel-doctor = "doctor.cli:main"
doctor = "doctor.cli:main"
